name: Signal Check

# WHEN THIS RUNS:
#   - GitHub's native hourly cron, AND
#   - cron-job.org calling the workflow_dispatch API, AND
#   - the "Run workflow" button.
#
# BOTH SCHEDULERS ON PURPOSE. Each has failed alone: GitHub's native cron
# was abandoned once for unreliability, and dispatch-only left an 11h gap on
# 2026-08-27. Two independent clocks means a missed tick from either is
# covered by the other. That is redundancy, and it is wanted.
#
# WHAT MAKES REDUNDANCY SAFE IS THE GUARD STEP BELOW. Without it the two
# triggers simply both ran: measured over 100 runs on 2026-08-27, 52
# `schedule` + 48 `workflow_dispatch`, median gap 0.50h instead of 1h —
# double the cadence and double the Adanos spend. The guard reads the last
# signal_log timestamp and stands down if another trigger already covered
# this window, so redundancy costs coverage, not quota.
#
# !!! QUOTA !!!
#   An executed run costs at most 1 Adanos request, and only when Step 1
#   clears the derived cutoff AND the cached reading for that symbol is
#   older than 12h. Replayed against the real log: ~31 requests/month per
#   ticker (~92 for three), against a 200/month free tier. Ceiling is
#   2/day/symbol = 62/month/ticker however many hours qualify.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

# Prevents two runs (e.g. a scheduled one + a manual "Run workflow" click)
# from racing to commit/push at the same time. Overlapping runs queue up
# one after another instead of colliding.
concurrency:
  group: signal-check
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Azure (which hosts GitHub-hosted runners) gets geo-blocked by
      # Binance's global API with an HTTP 451 error, same as US residential
      # IPs. Binance.US is NOT blocked from Azure, so route everything
      # there instead. This applies to every step in this job.
      BINANCE_REGION: US

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.lock

      # Two triggers drive this workflow (see the header). Whichever arrives
      # second sees a signal_log entry newer than 50 minutes and stands
      # down, so redundant coverage does not become redundant spend. The
      # `concurrency` group already serialises the pair, so the second run
      # checks out AFTER the first has pushed its row.
      #
      # Fails OPEN: missing/empty/unparseable log all proceed. A guard that
      # failed closed would silently stop the signal service, which is worse
      # than one duplicate run. Always exits 0 — standing down is a correct
      # outcome, not a red run.
      - name: Guard against double-firing
        id: guard
        run: python live_tools.py should-run --max-age-minutes 50
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Report which trigger executed
        run: |
          echo "trigger=${{ github.event_name }} should_run=${{ steps.guard.outputs.should_run }}"
          echo "### Signal check — trigger \`${{ github.event_name }}\`, should_run=\`${{ steps.guard.outputs.should_run }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Run Signal check
        if: steps.guard.outputs.should_run == 'true'
        env:
          ADANOS_API_KEY: ${{ secrets.ADANOS_API_KEY }}
        run: python live_tools.py check BTC --log-all --confirm-days 2 --long-only

      # SHADOW BASKET. Scored and logged, never published: separate file,
      # no alerts, no charts, and ZERO Adanos (ungated -- see the superset
      # property in shadow_basket.py). Runs AFTER the live check so it can
      # never delay or affect it, and `continue-on-error` guarantees a
      # shadow failure cannot fail a run whose live work already succeeded.
      - name: Shadow basket (26 tickers, never published)
        if: steps.guard.outputs.should_run == 'true'
        continue-on-error: true
        run: |
          python shadow_basket.py run
          python shadow_basket.py outcomes || echo "shadow outcomes non-fatal"

      - name: Build hosted charts (docs/ folder, served by GitHub Pages)
        if: steps.guard.outputs.should_run == 'true'
        run: |
          mkdir -p docs
          python - <<'PY'
          import live_tools as lt

          tickers = ["BTC"]
          built = []
          for t in tickers:
              try:
                  log = lt.load_log("signal_log.csv", ticker=t)
                  ohlcv = lt.fetch_price_ohlcv(t, interval="4h", bars=500)
                  lt.generate_html_chart(t, ohlcv, log, output_path=f"docs/{t}.html", interval="4h")
                  built.append(t)
                  print(f"built docs/{t}.html ({len(log)} signal(s) logged)")
              except Exception as e:
                  print(f"chart build failed for {t}: {type(e).__name__}: {e}")

          rows = "".join(
              f"<li><a style='color:#3b82f6;font-size:18px' href='{t}.html'>{t}</a></li>"
              for t in built
          )
          index = f"""<html><head><meta charset="utf-8"><title>Signal Charts</title></head>
          <body style="background:#0a0e17;color:#e5e7eb;font-family:-apple-system,sans-serif;padding:40px">
          <h1>Signal Charts</h1>
          <p style="color:#6b7280">Auto-updated by GitHub Actions. Open any ticker below &mdash;
          price updates live via Binance WebSocket in your browser.</p>
          <ul style="line-height:2">{rows}</ul>
          </body></html>"""
          with open("docs/index.html", "w") as f:
              f.write(index)
          PY

      - name: Resolve live signal outcomes (0 Adanos requests)
        if: steps.guard.outputs.should_run == 'true'
        run: python live_tools.py outcomes || echo "outcomes step non-fatal"

      - name: Commit updated log + hosted charts
        if: steps.guard.outputs.should_run == 'true'
        run: |
          git config user.name "signal-bot"
          git config user.email "actions@users.noreply.github.com"
          # Add only what exists. sentiment_cache.json and
          # signal_outcomes.csv are OPTIONAL artifacts — the cache is only
          # written once a sentiment call succeeds, and outcomes only once
          # an episode resolves. `git add` on a missing pathspec exits 128
          # and killed this whole step, discarding a completed run (signal
          # check, charts and outcomes had all succeeded). Missing optional
          # artifacts must never fail the commit.
          for f in signal_log.csv sentiment_cache.json signal_outcomes.csv shadow_log.csv shadow_outcomes.csv docs; do
            if [ -e "$f" ]; then
              git add "$f"
            else
              echo "skip (not present yet): $f"
            fi
          done
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Signal check: $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            # If someone else pushed in the meantime (e.g. you pushed
            # locally), rebase onto the latest before pushing, retrying a
            # few times in case of a brief race.
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then
                echo "Pushed successfully."
                break
              fi
              echo "Push attempt $i failed, retrying in 5s..."
              sleep 5
            done
          fi
